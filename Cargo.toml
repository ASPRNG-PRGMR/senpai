[workspace]
resolver = "2"
members = [
    "crates/senpai-core",
    "crates/senpai-pdf-poppler",
    "crates/senpai-render",
    "apps/senpai-cli",
    "apps/senpai-ui"
, "apps/win-test"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ASPRNG-PRGMR/senpai"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
