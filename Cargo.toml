[workspace]
resolver = "2"
members = [
    "crates/senpai-core",
    "crates/senpai-pdf-poppler",
    "crates/senpai-render",
    "apps/senpai-cli",
    "apps/senpai-ui"
, "apps/win-test"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "TBD"
repository = "https://github.com/YOUR_ORG/senpai"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
