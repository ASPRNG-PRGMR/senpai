[package]
name = "senpai-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "senpai-ui"
path = "src/main.rs"

[dependencies]
senpai-core = { path = "../../crates/senpai-core" }
senpai-pdf-poppler = { path = "../../crates/senpai-pdf-poppler" }

eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.29"
lru = "0.12"

# Native file dialog. The XDG portal backend is chosen deliberately over
# rfd's `gtk3` one: the portal talks D-Bus to whatever dialog the desktop
# already provides, so there's no GTK build- or link-time dependency to
# carry (and nothing new for CI to install). On Windows rfd opens the
# shell's Common Item Dialog (IFileOpenDialog) -- the Explorer picker
# itself -- through COM already present in the system, so the confirmed
# Windows DLL bundle is unaffected.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# CommonMark parsing for the Markdown reader. Pure Rust with no
# transitive dependencies of its own, so it adds nothing to the Windows
# DLL bundle; `default-features = false` drops the HTML writer, which is
# the opposite of what a reader needs.
pulldown-cmark = { version = "0.13", default-features = false }

[build-dependencies]
winres = "0.1"

